<h2 class="title mb-0">{{ deck.name }}</h2>
{% if deck.cards.all %}
    <div class="is-mobile" id="deck-list" x-data="{ showButton: false }">
    {% for card in deck.cards.all %}
        {% include "safmeds/single_card.html" with card=card %}
    {% endfor %}
    </div>
    <div class="buttons is-centered">
        <a class="button is-3 is-medium" @click="preview = false">Back</a>
        <a class="button is-3 is-success is-medium" href="{% url 'safmeds:play-deck' deck.slug %}">Play</a>
    </div>
{% else %}
    <div class="block" id="deck-list">
        <p class="subtitle is-2">This deck is empty</p>
    </div>
    <div class="buttons is-centered">
        <a class="button is-3" disabled>Play</a>
        <a class="button is-3" @click="preview = false">Back</a>
    </div>
{% endif %}
