{% extends "base.html" %}
{% block content %}
<div class="grid">
    {% for card in cards %}
    <div class="card" id="card-{{ card.id }}">
        <div class="card-content front">
            <p>
                {{ card.front }}
            </p>
        </div>
        <div class="card-content back">
            <p>
                {{ card.back }}
            </p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
