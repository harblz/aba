{% extends "base.html" %}
{% block content %}
    <form action="{% url 'login' %}" method="post" class="form" hx-boost="true" id="login-form">
        {% csrf_token %}
        <div class="field">
            {{ field.errors }}
            <label class="label" for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
            <div class="control">{{ form.username }}</div>
        </div>
        <div class="field">
            {{ field.errors }}
            <label class="label" for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
            <div class="control">{{ form.username }}</div>
        </div>
        <div class="field">
            <div class="control">
                <a href="">Sign Up</a>
            </div>
        </div>
        <div class="field">
            <div class="control>">
                <button @click="$dispatch('reset')" class="button">Cancel</button>
                <input @click="$dispatch('reset')" type="submit" formtarget="login-form" class="button" value="Submit">
            </div>
        </div>
    </form>
{% endblock content %}
