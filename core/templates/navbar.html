{% load static %}
<nav class="navbar is-fixed-bottom px-5" role="navigation">
    <div class="navbar-brand">
        <a class="navbar-item has-text-weight-bold" href="{% url 'home' %}">
            <h1 class="title is-family-secondary is-size-2">ABA.Rocks</h1>
        </a>
        <a role="button" id="burger" class="navbar-burger" aria-label="menu" data-target="navMenu"
           @click="$store.showMenu.toggle()" x-bind="burger">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </a>
    </div>
    <div class="navbar-menu" id="navbar-menu"
         x-show.important="$store.showMenu.show" x-collapse>
        <div class="navbar-start">
            {% for app, links in nav.items %}
                <a class="navbar-item is-size-4 is-tab has-text-weight-bold" href="{% url links.root %}">{{ app }}</a>
            {% endfor %}
        </div>
        <div class="navbar-end">
            <div class="navbar-item is-size-4 is-tab">
                <button class="icon has-text-text-bold is-large"
                        @click="$store.themeSwitcher.toggle()">
                    <i class="fas fa-lightbulb is-large"></i>
                </button>
            </div>
            <div class="navbar-item is-size-4 is-tab">
                <a class="icon has-text-text-bold is-large">
                    <i class="fa-brands fa-instagram is-large"></i>
                </a>
            </div>
            <div class="navbar-item is-size-4 is-tab">
                <a class="icon has-text-text-bold is-large" href="https://ko-fi.com/abarocks">
                    <i class="fas fa-mug-hot"></i>
                </a>
            </div>
            <div class="navbar-item is-size-4 is-tab">
                <a class="has-text-text-bold has-text-weight-bold" href="{% url 'login' %}">Log In</a>
            </div>
        </div>
    </div>
</nav>
