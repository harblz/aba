services:
  db:
    image: postgres
    init: true
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_DB_FILE: /run/secrets/postgres_db
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db
  web:
    build:
      secrets:
        - debug
      context: .
      dockerfile: Dockerfile
      cache_from:
        - myapp:latest
    secrets:
      - debug
      - secret_key
      - allowed_hosts
      - internal_ips
      - postgres_db
      - postgres_password
      - postgres_user
      - postgres_port
      - postgres_host
      - email_user
      - email_password
    environment:
      SECRETS_DIR: "/run/secrets"
      NODE_ENV: "production"
    ports:
      - "8000:8000"
    depends_on:
      - db
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import socket,sys; s=socket.socket(); s.settimeout(1); s.connect((\"127.0.0.1\",8000)); s.close(); sys.exit(0)'" ]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
secrets:
  debug:
    file: ${HOME}/.secrets/abarocks/DEBUG
  secret_key:
    file: ${HOME}/.secrets/abarocks/SECRET_KEY
  allowed_hosts:
    file: ${HOME}/.secrets/abarocks/ALLOWED_HOSTS
  internal_ips:
    file: ${HOME}/.secrets/abarocks/INTERNAL_IPS
  postgres_db:
    file: ${HOME}/.secrets/abarocks/POSTGRES_DB
  postgres_password:
    file: ${HOME}/.secrets/abarocks/POSTGRES_PASSWORD
  postgres_user:
    file: ${HOME}/.secrets/abarocks/POSTGRES_USER
  postgres_port:
    file: ${HOME}/.secrets/abarocks/POSTGRES_PORT
  postgres_host:
    file: ${HOME}/.secrets/abarocks/POSTGRES_HOST
  email_user:
    file: ${HOME}/.secrets/abarocks/EMAIL_USER
  email_password:
    file: ${HOME}/.secrets/abarocks/EMAIL_PASSWORD

volumes:
  postgres_data:
