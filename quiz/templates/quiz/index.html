{% extends "base.html" %}

{% include "components/_hero.html" %}

{% for quiz in quizzes %}
  <div class="column deck-column is-size-5">
        <div class="card deck has-background-black-bold has-text-black-bold-invert">
            <div class="card-header deck-name has-background-black-bold-invert">
                <p class="card-header-title is-centered">{{ quiz.course_id }} Practice Quiz Number {{ quiz.number}}</p>
            </div>
            <div class="card-content deck-info">
                <div class="content">{{ quiz.desc }}</div>
            </div>
            <div class="card-footer deck-foot">
                <a type="button" class="button is-large card-footer-item has-background-primary"
                   href="{% url 'quiz:quiz' quiz.course_id quiz.number %}">Select</a>
            </div>
        </div>
    </div>
{% endfor %}
</section>
</section>
{% endblock content %}
