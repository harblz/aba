{% load static %}
<progress class="progress is-warning"
          id="progressBar"
          :value="count"
          max="{{ total }}"
          x-text="count"
          hx-preserve
></progress>
<br>
<form id="questionForm"
      hx-post="{% url 'quiz:continue' %}?action={{ action }}"
      hx-swap="innerHTML"
      hx-target="#quiz-wrapper"
      x-data="{ loading: false }"
      :class="{'is-loading': loading }"
      @click="loading = !loading">
  {{ question|safe }}
  {% csrf_token %}
  <div class="field">
    <legend>{{ form.answer.label }}</legend>
    <div class="radios is-flex-direction-column">
    {% for radio in form.answer %}
      <label class="radio has-text-justified p-4 is-size-6" for="{{ radio.id_for_label }}">
        {{ radio.tag }}
        {{ radio.choice_label|striptags }}
      </label>
    {% endfor %}  
    </div>
  </div>
  <button class="button is-primary" type="submit">Next Question</button>
</form>
