{% load static %}
{{ question|safe }}
<form hx-post="{% url 'quiz:continue' %}?next"
      hx-swap="innerHTML"
      hx-target="#content"
      hx-indicator="#spinner">
  {% csrf_token %}
  
  {% for field in form %}
      <div id="answers" class="fieldWrapper">
          {{ field.errors }}
          {{ field.label_tag.as_field_group }} 
          {{ field.as_field_group }}
      </div>
  {% endfor %}

  <button class="button is-primary" type="submit">Next Question</button>
  <img id="spinner" height="auto" width="auto" alt="loading spinner" class="htmx-indicator" src="{% static 'img/spinners/bars-min.svg' %}"/>
</form>
