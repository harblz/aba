services:
  db:
    image: postgres
    init: true
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_DB_FILE: /run/secrets/postgres_db
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db
  devcontainer:
    build:
      secrets:
        - debug
        - secret_key
        - allowed_hosts
        - internal_ips
        - postgres_db
        - postgres_password
        - postgres_user
        - postgres_port
      args:
        DEBUG: /run/secrets/DEBUG
        POSTGRES_HOST: db
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ../:/workspace/abarocks

secrets:
  debug:
    file: ../secrets/DEBUG
  secret_key:
    file: ../secrets/SECRET_KEY
  allowed_hosts:
    file: ../secrets/ALLOWED_HOSTS
  internal_ips:
    file: ../secrets/INTERNAL_IPS
  postgres_db:
    file: ../secrets/POSTGRES_DB
  postgres_password:
    file: ../secrets/POSTGRES_PASSWORD
  postgres_user:
    file: ../secrets/POSTGRES_USER
  postgres_port:
    file: ../secrets/POSTGRES_PORT

volumes:
  postgres_data:
