[project]
name = "abarocks"
version = "2.0.0"
description = "ABA Rocks is an open-source web app for aspiring behavior analysts!"
authors = [
    { name="Alex Raymond", email="harblz@gmail.com" },
    { name="Kyle Jensen", email="kyle@nullandvoid.digital" }
]
license = "n"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"django >= 5.2",
"whitenoise >= 6.7",
"django-taggit >= 6.0",
"django-htmx >= 1.19",
"fontawesomefree >= 6.6.0",
"django-ckeditor-5 >= 0.2.13",
"pip >= 25.0.1",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ipython = "^8.31.0"
black = {extras = ["d"], version = "^24.10.0"}
setuptools = "^75.8.0"
django-extensions = "^3.2.3"
django-debug-toolbar = "^5.0.1"
werkzeug = "^3.1.3"
pygraphviz = "^1.14"
psycopg = {extras = ["binary"], version = "^3.2.4"}
gunicorn = "^23.0.0"
django-stubs = "^5.1.3"


[tool.poetry.group.prod]
optional = true


[tool.poetry.group.prod.dependencies]
psycopg = {extras = ["c"], version = "^3.2.4"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
