[project]
name = "abarocks"
version = "2.0.0"
description = "ABA Rocks is an open-source web app for aspiring behavior analysts!"
authors = [
    { name="Alex Raymond", email="harblz@gmail.com" },
    { name="Kyle Jensen", email="kyle@nullandvoid.digital" }
]
license = "n"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django~=6.0",
    "whitenoise~=6.7",
    "django-taggit~=6.0",
    "django-htmx~=1.19",
    "fontawesomefree~=6.6.0",
    "django-ckeditor-5~=0.2.13",
    "pip~=26.0.1",
    "django-allauth[socialaccount,mfa]~=65.0",
]

[dependency-groups]
dev = [
    "ipython",
    "black[d]",
    "django-extensions",
    "django-debug-toolbar",
    "werkzeug~=3.1.3",
    "pygraphviz~=1.14",
    "psycopg[binary]~=3.0",
    "gunicorn~=25.0",
    "setuptools~=82.0",
]
prod = [
    "psycopg[c]~=3.0",
]

[tool.uv]
package = false
